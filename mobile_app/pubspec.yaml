name: smart_glasses_app
description: "Herramienta profesional de apoyo técnico con gafas inteligentes, IA multimodal y capa de diagnóstico."
publish_to: "none"
version: 1.2.0+12

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_blue_plus: 1.31.14
  http: ^1.2.1
  web_socket_channel: ^3.0.0
  network_info_plus: ^6.0.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  record: ^5.1.2
  audioplayers: ^6.0.0
  path_provider: ^2.1.3
  file_picker: ^8.0.0
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  flutter_foreground_task: ^8.17.0
  share_plus: ^10.0.2
  flutter_tts: 4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  record_platform_interface: 1.1.0

flutter:
  uses-material-design: true
